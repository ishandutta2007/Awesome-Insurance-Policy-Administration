<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Glassmorphism Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 42px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .dash-flow {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .float-card {
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.98); opacity: 0.4; }
      100% { transform: scale(1.02); opacity: 0.8; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -200; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic/Animated Background Graphics (Kept behind foreground text) -->
  <!-- Glowing Ambient Circles -->
  <circle cx="150" cy="80" r="180" fill="#4f46e5" filter="url(#glow)" opacity="0.25" class="pulse-circle" />
  <circle cx="1050" cy="280" r="160" fill="#c084fc" filter="url(#glow)" opacity="0.2" class="pulse-circle" />

  <!-- Animated Flow Lines in Background -->
  <path d="M -50 280 Q 300 320 600 240 T 1250 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" class="dash-flow" />
  <path d="M -50 100 Q 400 40 800 160 T 1250 100" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.2" class="dash-flow" />

  <!-- Decorative Floating Card Element (Right Side) -->
  <g class="float-card" transform="translate(820, 60)">
    <rect width="320" height="230" rx="16" fill="url(#glassGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" />
    <!-- Node / Flow Diagram inside card -->
    <rect x="30" y="35" width="110" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1" />
    <text x="85" y="58" font-family="sans-serif" font-size="12" fill="#93c5fd" text-anchor="middle" font-weight="600">Quoting &amp; Rating</text>
    
    <path d="M 140 53 L 180 53 L 180 115 L 200 115" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />

    <rect x="30" y="95" width="110" height="36" rx="8" fill="#a855f7" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
    <text x="85" y="118" font-family="sans-serif" font-size="12" fill="#e9d5ff" text-anchor="middle" font-weight="600">Policy Lifecycle</text>

    <path d="M 140 113 L 200 113" fill="none" stroke="#94a3b8" stroke-width="1.5" />

    <rect x="200" y="95" width="90" height="36" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="1" />
    <text x="245" y="118" font-family="sans-serif" font-size="12" fill="#a7f3d0" text-anchor="middle" font-weight="600">Issuance</text>

    <rect x="30" y="155" width="260" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#475569" stroke-width="1" />
    <circle cx="55" cy="175" r="6" fill="#10b981" />
    <text x="72" y="179" font-family="sans-serif" font-size="12" fill="#cbd5e1">Core PAS Engine Connected</text>
  </g>

  <!-- Foreground Main Content Header -->
  <!-- Top Category Pill -->
  <g transform="translate(70, 65)">
    <rect width="320" height="30" rx="15" fill="url(#pillGrad)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="15" r="4" fill="#818cf8" />
    <text x="35" y="20" class="badge-text">INSURTECH &amp; POLICY ADMIN ECOSYSTEM</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="70" y="150" class="title">Awesome Insurance Policy</text>
  <text x="70" y="200" class="title" fill="url(#accentGrad)">Administration 🛡️</text>

  <text x="70" y="255" class="subtitle">Curated Guide to PAS SaaS Platforms, Open-Source Repos &amp; Core Insurance Systems</text>

  <!-- Bottom Accent Bar -->
  <rect x="70" y="295" width="680" height="4" rx="2" fill="url(#accentGrad)" />
</svg>
